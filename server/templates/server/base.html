<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <!-- Подключение Bootstrap CSS -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
     <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Рассылки</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="{% url 'server:index' %}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'server:recipient_list' %}">Получатели</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'server:message_list' %}">Cообщения</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'server:mailing_create' %}">Создать рассылку</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'server:message_create' %}">Создать сообщение</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'server:recipient_create' %}">Добавить получателя</a>
                </li>
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <form method="post" action="#" style="display: inline">
                        {% csrf_token %}
                        <button type="submit" class="btn-link nav-link">Выйти</button>
                    </form>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="#">Войти</a>
                <li class="nav-item">
                    <a class="nav-link" href="#">Регистрация</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>
    <!-- Подключение Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
