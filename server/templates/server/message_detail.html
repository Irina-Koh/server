{% extends 'server/base.html' %}
{% block title%}Информация о получателе{% endblock%}

{% block content %}
{% include 'server/header.html' %}


<p>Тема: {{ object.subject }} </p>
<p>Сообщение: {{ object.body }}</p>
<a href="{% url 'server:message_update' object.pk %}" class="btn btn-secondary">Редактировать</a>
<a href="{% url 'server:message_confirm_delete' object.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'server:message_list' %}" class="btn btn-primary">Вернуться к списку</a>
{% endblock %}
