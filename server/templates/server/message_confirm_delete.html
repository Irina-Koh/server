{% extends 'server/base.html' %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
{% include 'server/header.html' %}
<h2>Удалить рассылку</h2>
<p>Вы уверены, что хотите удалить "{{ message.subject }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'server:message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
